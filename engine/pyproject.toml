[project]
name = "reoengine"
version = "0.1.0"
description = "Offline-testable primitives for ReOEngine"
requires-python = ">=3.11"
dependencies = []
license = { text = "Apache-2.0" }

[project.urls]
Repository = "https://github.com/reiki-dev/reoengine"

[project.scripts]
reoengine = "reoengine.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["reoengine*"]

[tool.setuptools.package-data]
reoengine = ["_resources/*", "_resources/schemas/*.json"]

[tool.mypy]
strict = true
python_version = "3.11"
cache_dir = "engine/.mypy_cache"
